name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install an X server, a window manager and Qt's X11 libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libegl1 libgl1 \
            libfontconfig1 libdbus-1-3
      - name: Allow a virtual gamepad for the tests
        run: |
          sudo modprobe uinput || true
          printf '%s\n' 'KERNEL=="uinput", MODE="0666"' 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-handheldcord-ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod 666 /dev/uinput || true
      - run: python -m pip install -e ".[dev]"
      - name: Test against a virtual X11 display
        run: xvfb-run -a -s "-screen 0 1280x720x24" sh -c "openbox & sleep 1; python -m pytest -q -rs"
      - name: Build the Linux app and start it
        run: |
          python -m pip install -e ".[build]"
          python packaging/build.py
          mkdir -p /tmp/smoke && echo '{"setup_done": true}' > /tmp/smoke/config.json
          xvfb-run -a -s "-screen 0 1280x720x24" sh -c \
            "openbox & sleep 1; dist/HandheldCord/HandheldCord --dry-run --config /tmp/smoke/config.json --exit-after 4"
          cat /tmp/smoke/handheldcord.log
          grep -q "Hotkey overlay registered" /tmp/smoke/handheldcord.log
          ! grep -q "Traceback" /tmp/smoke/handheldcord.log
