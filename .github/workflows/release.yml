name: Release

# Push a tag like v0.1.0 to build Windows and Linux and publish both as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest -q
      - name: Check that the tag matches the package version
        shell: pwsh
        run: |
          $version = python -c "import handheldcord; print(handheldcord.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      - run: python packaging/build.py
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $flags = @()
          if ($tag -like "v0.*") { $flags += "--prerelease" }
          $zip = (Get-ChildItem dist/*.zip).FullName
          gh release create $tag $zip --title "HandheldCord $tag" --notes-file packaging/release-notes.md @flags

  linux:
    needs: release
    # The oldest supported Ubuntu, so the build runs on every newer distribution (SteamOS, Bazzite, …).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install an X server, a window manager and Qt's X11 libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libegl1 libgl1 \
            libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev,build]"
      - run: xvfb-run -a -s "-screen 0 1280x720x24" sh -c "openbox & sleep 1; python -m pytest -q"
      - run: python packaging/build.py
      - name: Add the Linux build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.tar.gz
