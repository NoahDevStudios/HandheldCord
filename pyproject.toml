[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handheldcord"
version = "0.1.0"
description = "Controller-first companion for the official Discord app on Windows handhelds"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
handheldcord = "handheldcord.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"handheldcord.ui" = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
